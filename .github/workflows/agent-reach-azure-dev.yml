name: Agent Reach Azure development deployment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and tests
        run: python -m pip install . 'mcp>=1.10,<2' 'PyJWT[crypto]>=2.9,<3' 'uvicorn>=0.30,<1' pytest httpx
      - name: Run security regression tests
        run: python -m pytest deploy/azure/test_security.py deploy/azure/test_http.py -q
      - name: Build container
        run: docker build -f deploy/azure/Dockerfile -t agent-reach-mcp:verify .
  deploy:
    needs: verify
    if: ${{ vars.AGENT_REACH_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Require dedicated deployment configuration
        env:
          CLIENT_ID: ${{ vars.AGENT_REACH_AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AGENT_REACH_AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AGENT_REACH_AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.AGENT_REACH_RESOURCE_GROUP }}
          REGISTRY_NAME: ${{ vars.AGENT_REACH_ACR_NAME }}
          APP_NAME: ${{ vars.AGENT_REACH_APP_NAME }}
        run: |
          set -eu
          for v in CLIENT_ID TENANT_ID SUBSCRIPTION_ID RESOURCE_GROUP REGISTRY_NAME APP_NAME; do
            test -n "${!v}" || { echo "Missing $v"; exit 1; }
          done
          test "$RESOURCE_GROUP" = "rg-te-agent-reach-dev" || { echo "Unexpected resource group"; exit 1; }
      - name: Azure login with dedicated GitHub OIDC federation
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AGENT_REACH_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AGENT_REACH_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AGENT_REACH_AZURE_SUBSCRIPTION_ID }}
      - name: Confirm pre-existing isolated infrastructure
        env:
          RG: ${{ vars.AGENT_REACH_RESOURCE_GROUP }}
          ACR: ${{ vars.AGENT_REACH_ACR_NAME }}
          APP: ${{ vars.AGENT_REACH_APP_NAME }}
        run: |
          set -euo pipefail
          az group show -n "$RG" -o none
          az acr show -g "$RG" -n "$ACR" -o none
          az containerapp show -g "$RG" -n "$APP" -o none
          # Never create or expose a Container App through this workflow.
      - name: Build and publish to isolated ACR
        env:
          RG: ${{ vars.AGENT_REACH_RESOURCE_GROUP }}
          ACR: ${{ vars.AGENT_REACH_ACR_NAME }}
        run: |
          set -euo pipefail
          az acr build --registry "$ACR" --resource-group "$RG" --image "agent-reach-mcp:${GITHUB_SHA}" --file deploy/azure/Dockerfile .
      - name: Deploy to existing private Container App
        env:
          RG: ${{ vars.AGENT_REACH_RESOURCE_GROUP }}
          ACR: ${{ vars.AGENT_REACH_ACR_NAME }}
          APP: ${{ vars.AGENT_REACH_APP_NAME }}
        run: |
          set -euo pipefail
          external="$(az containerapp show -g "$RG" -n "$APP" --query 'properties.configuration.ingress.external' -o tsv)"
          test "$external" = "false" || { echo "Refusing deployment: external ingress enabled"; exit 1; }
          server="$(az acr show -g "$RG" -n "$ACR" --query loginServer -o tsv)"
          az containerapp update -g "$RG" -n "$APP" --image "$server/agent-reach-mcp:${GITHUB_SHA}" -o none
